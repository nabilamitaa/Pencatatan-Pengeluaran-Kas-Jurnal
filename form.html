<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Voucher Kas Keluar</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library Supabase untuk koneksi ke basis data cloud -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Menghilangkan panah atas/bawah pada input number untuk tampilan yang lebih bersih */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        
        <div class="bg-blue-700 px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-wide">VOUCHER KAS KELUAR</h1>
                <p class="text-blue-100 text-sm mt-1">Formulir Pencatatan Pengeluaran Kas & Jurnal</p>
            </div>
            <div class="hidden sm:block text-right">
                <div class="text-white opacity-80 text-xs uppercase tracking-wider">Status</div>
                <div id="badge-status" class="mt-1 px-3 py-1 bg-gray-300 text-gray-700 text-xs font-bold rounded-full uppercase transition-colors">
                    Draft
                </div>
            </div>
        </div>

        <form id="voucher-form" class="p-6 sm:p-8" >
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label for="nomor_bukti" class="block text-sm font-semibold text-gray-700 mb-2">Nomor Bukti <span class="text-red-500">*</span></label>
                    <input type="text" id="nomor_bukti" required placeholder="Contoh: VKK-2023-10-001" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-gray-800">
                </div>
                <div>
                    <label for="tanggal" class="block text-sm font-semibold text-gray-700 mb-2">Tanggal Transaksi <span class="text-red-500">*</span></label>
                    <input type="date" id="tanggal" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-gray-800">
                </div>
                <div class="md:col-span-2">
                    <label for="keterangan" class="block text-sm font-semibold text-gray-700 mb-2">Keterangan Pengeluaran</label>
                    <textarea id="keterangan" rows="2" placeholder="Tuliskan deskripsi pengeluaran di sini..." 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-gray-800"></textarea>
                </div>
            </div>

            <div class="mb-2 flex justify-between items-end">
                <h2 class="text-lg font-bold text-gray-800 border-b-2 border-blue-500 pb-1 inline-block">Baris Jurnal</h2>
                <button type="button" onclick="addRow()" 
                        class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Tambah Baris
                </button>
            </div>

            <div class="overflow-x-auto rounded-lg border border-gray-200 mb-6 shadow-sm">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider">
                            <th class="p-4 font-semibold w-12 text-center">#</th>
                            <th class="p-4 font-semibold w-1/3">Nama Akun</th>
                            <th class="p-4 font-semibold text-right w-1/4">Debit (Rp)</th>
                            <th class="p-4 font-semibold text-right w-1/4">Kredit (Rp)</th>
                            <th class="p-4 font-semibold text-center w-16">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="journal-body" class="divide-y divide-gray-200 bg-white">
                        <!-- Baris akan ditambahkan via JavaScript -->
                    </tbody>
                    
                    <tfoot class="bg-gray-50 font-semibold border-t-2 border-gray-300">
                        <tr>
                            <td colspan="2" class="p-4 text-right text-gray-700">TOTAL:</td>
                            <td class="p-4 text-right">
                                <span class="text-gray-500 mr-1">Rp</span>
                                <span id="total-debit-text" class="text-gray-800 tracking-wider">0</span>
                            </td>
                            <td class="p-4 text-right">
                                <span class="text-gray-500 mr-1">Rp</span>
                                <span id="total-kredit-text" class="text-gray-800 tracking-wider">0</span>
                            </td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center p-5 bg-gray-50 rounded-lg border border-gray-200 gap-4">
                
                <div class="flex-1">
                    <div class="text-sm text-gray-500 mb-1 font-medium">Status Jurnal:</div>
                    <div id="status-message" class="text-lg font-bold text-gray-500 flex items-center gap-2">
                        <!-- Status text will appear here -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        MOHON ISI JURNAL
                    </div>
                    <div id="status-submessage" class="text-sm font-medium mt-1"></div>
                </div>

                <div>
                    <button type="submit" id="btn-submit" disabled
                            class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white px-8 py-3 rounded-lg font-bold shadow-md transition-all duration-300 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Simpan Voucher
                    </button>
                </div>

            </div>
        </form>
    </div>

    <script>
        // Set tanggal default ke hari ini
        document.getElementById('tanggal').valueAsDate = new Date();

        const journalBody = document.getElementById('journal-body');
        let rowCount = 0;
        
        // Fungsi untuk format mata uang Rupiah
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID').format(number);
        };

        function addRow() {
            rowCount++;
            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition-colors group";
            tr.innerHTML = `
                <td class="p-4 text-center text-sm text-gray-400 font-medium row-number">${rowCount}</td>
                <td class="p-3">
                    <input type="text" required placeholder="Kode akun (mis. 6-100)" 
                           class="akun-input w-full px-3 py-2 bg-transparent border border-transparent hover:border-gray-300 focus:border-blue-500 focus:bg-white rounded transition-all text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-100">
                </td>
                <td class="p-3 relative">
                    <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm">Rp</span>
                    <input type="number" min="0" value="" placeholder="0"
                           class="debit-input w-full pl-9 pr-3 py-2 bg-transparent border border-transparent hover:border-gray-300 focus:border-blue-500 focus:bg-white rounded transition-all text-sm font-semibold text-right text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-100 text-right">
                </td>
                <td class="p-3 relative">
                    <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm">Rp</span>
                    <input type="number" min="0" value="" placeholder="0"
                           class="kredit-input w-full pl-9 pr-3 py-2 bg-transparent border border-transparent hover:border-gray-300 focus:border-blue-500 focus:bg-white rounded transition-all text-sm font-semibold text-right text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-100 text-right">
                </td>
                <td class="p-3 text-center">
                    <button type="button" onclick="removeRow(this)" 
                            class="text-gray-400 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition-colors opacity-50 group-hover:opacity-100" title="Hapus Baris">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </td>
            `;
            journalBody.appendChild(tr);
            updateRowNumbers();
            calculateTotals();
        }

        function removeRow(btn) {
            // Minimal harus ada 2 baris (Debit & Kredit umumnya)
            if(journalBody.children.length <= 2) {
                // Jangan paksa hapus jika hanya ada 2, tapi kosongkan saja nilainya (pilihan UX)
                // Namun untuk form ini kita izinkan hapus tapi setidaknya 1 baris.
                if(journalBody.children.length === 1) return;
            }
            
            const tr = btn.closest('tr');
            tr.remove();
            updateRowNumbers();
            calculateTotals();
        }

        function updateRowNumbers() {
            const rows = journalBody.querySelectorAll('tr');
            rows.forEach((row, index) => {
                row.querySelector('.row-number').textContent = index + 1;
            });
            rowCount = rows.length;
        }

        function calculateTotals() {
            let totalDebit = 0;
            let totalKredit = 0;

            // Ambil semua input debit
            const debitInputs = document.querySelectorAll('.debit-input');
            debitInputs.forEach(input => {
                const val = parseFloat(input.value) || 0;
                totalDebit += val;
            });

            // Ambil semua input kredit
            const kreditInputs = document.querySelectorAll('.kredit-input');
            kreditInputs.forEach(input => {
                const val = parseFloat(input.value) || 0;
                totalKredit += val;
            });

            // Pembulatan 2 desimal agar tidak terjadi galat floating point (mis. 0.1 + 0.2)
            totalDebit = Math.round(totalDebit * 100) / 100;
            totalKredit = Math.round(totalKredit * 100) / 100;

            // Update teks total
            document.getElementById('total-debit-text').textContent = formatRupiah(totalDebit);
            document.getElementById('total-kredit-text').textContent = formatRupiah(totalKredit);

            // Validasi Keseimbangan
            validateBalance(totalDebit, totalKredit);
        }

        function validateBalance(debit, kredit) {
            const statusMessage = document.getElementById('status-message');
            const statusSubmessage = document.getElementById('status-submessage');
            const submitBtn = document.getElementById('btn-submit');
            const badgeStatus = document.getElementById('badge-status');

            // Reset classes
            statusMessage.className = "text-lg font-bold flex items-center gap-2 ";
            statusSubmessage.className = "text-sm font-medium mt-1 ";

            if (debit === 0 && kredit === 0) {
                // Keadaan awal atau kosong
                statusMessage.classList.add("text-gray-500");
                statusMessage.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> MOHON ISI JURNAL`;
                statusSubmessage.textContent = "";
                
                submitBtn.disabled = true;
                badgeStatus.textContent = "Draft";
                badgeStatus.className = "mt-1 px-3 py-1 bg-gray-300 text-gray-700 text-xs font-bold rounded-full uppercase transition-colors";
                
            } else if (debit === kredit) {
                // Jurnal Seimbang!
                statusMessage.classList.add("text-green-600");
                statusMessage.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> SEIMBANG`;
                
                statusSubmessage.classList.add("text-green-600");
                statusSubmessage.textContent = "Total Debit dan Kredit sudah sesuai.";
                
                submitBtn.disabled = false; // Aktifkan tombol submit
                
                badgeStatus.textContent = "Ready";
                badgeStatus.className = "mt-1 px-3 py-1 bg-green-500 text-white text-xs font-bold rounded-full uppercase transition-colors";

            } else {
                // Jurnal Tidak Seimbang (Selisih)
                const selisih = Math.abs(debit - kredit);
                
                statusMessage.classList.add("text-red-600");
                statusMessage.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg> TIDAK SEIMBANG`;
                
                statusSubmessage.classList.add("text-red-600");
                
                // Cek mana yang lebih besar untuk info selisih yang lebih detail
                let infoSelisih = debit > kredit ? "(Debit lebih besar)" : "(Kredit lebih besar)";
                statusSubmessage.textContent = `Selisih: Rp ${formatRupiah(selisih)} ${infoSelisih}`;
                
                submitBtn.disabled = true; // Nonaktifkan tombol submit
                
                badgeStatus.textContent = "Error";
                badgeStatus.className = "mt-1 px-3 py-1 bg-red-500 text-white text-xs font-bold rounded-full uppercase transition-colors";
            }
        }

        // Menggunakan Event Delegation pada table body (journal-body) 
        // sehingga input yang baru ditambah juga akan otomatis merespon
        document.getElementById('journal-body').addEventListener('input', function(e) {
            if (e.target.classList.contains('debit-input') || e.target.classList.contains('kredit-input')) {
                // Validasi agar tidak memasukkan angka negatif
                if(parseFloat(e.target.value) < 0) {
                    e.target.value = 0;
                }
                
                // Fitur UX: Jika isi Debit, kosongkan Kredit. Begitu sebaliknya di baris yang sama.
                const row = e.target.closest('tr');
                if(e.target.classList.contains('debit-input') && e.target.value !== "" && parseFloat(e.target.value) !== 0) {
                    row.querySelector('.kredit-input').value = "";
                } else if(e.target.classList.contains('kredit-input') && e.target.value !== "" && parseFloat(e.target.value) !== 0) {
                    row.querySelector('.debit-input').value = "";
                }

                // Kalkulasi ulang
                calculateTotals();
            }
        });

        // ===== Koneksi ke Supabase (basis data cloud) =====
        // Isi dengan Project URL dan anon key dari menu Project Settings > API di Supabase
        const SUPABASE_URL = 'https://rpxtzmdhcgfslzxnmcqy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_dJaJuSsLYsKWisI__gntnQ_1L-JiloK';
        const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        document.getElementById('voucher-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!db) { alert('Library Supabase belum termuat, periksa koneksi internet.'); return; }
            const baris = [...journalBody.querySelectorAll('tr')].map(tr => ({
                akun:   tr.querySelector('.akun-input').value.trim(),
                debit:  parseFloat(tr.querySelector('.debit-input').value) || 0,
                kredit: parseFloat(tr.querySelector('.kredit-input').value) || 0
            }));

            // Memanggil fungsi simpan_voucher di database (Supabase RPC).
            // Database memeriksa ulang keseimbangan, jadi data salah tetap ditolak.
            const { data, error } = await db.rpc('simpan_voucher', {
                p_tanggal:    document.getElementById('tanggal').value,
                p_nomor:      document.getElementById('nomor_bukti').value,
                p_keterangan: document.getElementById('keterangan').value,
                p_baris:      baris
            });

            if (error) {
                alert('Gagal disimpan: ' + error.message);
            } else {
                alert('Voucher tersimpan di database dengan ID jurnal ' + data);
                e.target.reset();
                journalBody.innerHTML = '';
                addRow(); addRow();
                document.getElementById('tanggal').valueAsDate = new Date();
            }
        });

        window.onload = () => {
            // Tambahkan 2 baris awal secara otomatis saat halaman dimuat
            addRow(); 
            addRow();
        };

    </script>
</body>
</html>
